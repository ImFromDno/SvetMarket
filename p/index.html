<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Поиск заказа и отметка «получены»</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.14);
      --warn-bg: rgba(245, 158, 11, 0.14);
      --err-bg: rgba(239, 68, 68, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.35rem;
      margin: 0 0 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 18px;
    }

    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      transition: background 0.15s ease, opacity 0.15s ease;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-success {
      background: #16a34a;
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
    }

    .btn-success:hover:not(:disabled) {
      background: #15803d;
    }

    .notice {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      border: 1px solid transparent;
      display: none;
    }

    .notice.show {
      display: block;
    }

    .notice.info {
      background: rgba(59, 130, 246, 0.14);
      border-color: rgba(59, 130, 246, 0.35);
      color: #bfdbfe;
    }

    .notice.error {
      background: var(--err-bg);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fecaca;
    }

    .notice.ok {
      background: var(--success-bg);
      border-color: rgba(34, 197, 94, 0.4);
      color: #bbf7d0;
    }

    .results {
      margin-top: 16px;
      display: grid;
      gap: 12px;
    }

    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .sheet-badge {
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .status-pill {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--warn-bg);
      color: #fde68a;
    }

    .status-pill.received {
      background: var(--success-bg);
      color: #86efac;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 14px;
      font-size: 0.9rem;
    }

    .meta-item {
      color: var(--muted);
    }

    .meta-item strong {
      color: var(--text);
      font-weight: 500;
    }

    .meta-full {
      grid-column: 1 / -1;
    }

    @media (max-width: 480px) {
      .search-box {
        flex-direction: column;
      }
      .meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

    <div class="search-box">
      <input

        id="trackInput"
        placeholder="Введите трек-номер..."

    </div>

    <div class="notice" id="noticeBox"></div>
    <div class="results" id="resultsBox"></div>
  </div>
