<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог продукции</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
      --green: #16a34a;
      --orange: #d97706;
      --red: #dc2626;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 0;
    }
    .logo { font-size: 20px; font-weight: 700; }
    .logo span { color: var(--primary); }

    .layout {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      padding: 24px 0 48px;
    }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
    }

    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    @media (max-width: 900px) {
      .sidebar { width: 100%; min-width: 100%; }
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .all-cats-btn {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      text-align: left;
      transition: 0.15s;
    }
    .all-cats-btn:hover { border-color: var(--primary); color: var(--primary); }
    .all-cats-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .category-group {
      margin-bottom: 8px;
    }
    .cat-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border: none;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      border-radius: 8px;
      text-align: left;
      transition: 0.15s;
    }
    .cat-header:hover { background: var(--bg); color: var(--primary); }
    .cat-header.active-parent { color: var(--primary); background: #f8fafc; }
    .cat-arrow {
      font-size: 12px;
      transition: transform 0.2s;
    }
    .category-group.open .cat-arrow { transform: rotate(180deg); }

    .sub-list {
      display: none;
      flex-direction: column;
      gap: 4px;
      padding-left: 12px;
      margin: 4px 0 8px 8px;
      border-left: 2px solid var(--border);
    }
    .category-group.open .sub-list { display: flex; }

    .sub-btn {
      background: transparent;
      border: none;
      padding: 7px 10px;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      border-radius: 6px;
      transition: 0.15s;
    }
    .sub-btn:hover { color: var(--text); background: var(--bg); }
    .sub-btn.active {
      color: var(--primary);
      background: #eff6ff;
      font-weight: 600;
    }

    .content-area {
      flex-grow: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: var(--surface);
      outline: none;
    }
    .search-box input:focus { border-color: var(--primary); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-img {
      aspect-ratio: 16/9;
      
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .card-img img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
      padding: 0px;
    }
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #fff;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .title:hover { color: var(--primary); }

    .variants {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .var-btn {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
    }
    .var-btn.active {
      background: #eff6ff;
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .price { font-size: 17px; font-weight: 700; }
    .stock { font-size: 11px; font-weight: 500; }
    .stock.in { color: var(--green); }
    .stock.order { color: var(--orange); }
    .stock.out { color: var(--red); }

    .details-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      cursor: pointer;
    }
    .details-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      padding: 24px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--bg);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }
    .status-msg { text-align: center; padding: 40px; color: var(--muted); grid-column: 1/-1; }
  </style>
</head>
<body>

<header>
  <div class="container header-top">
    <div class="logo">Каталог <span>Продукции</span></div>
  </div>
</header>

<main class="container layout">
  <aside class="sidebar">
    <div class="sidebar-title">Каталог</div>
    <button class="all-cats-btn active" id="allCatsBtn" onclick="setCategory('ALL')">Все товары</button>
    <div id="categoryAccordion"></div>
  </aside>

  <div class="content-area">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск товара..." />
    </div>
    <div class="grid" id="catalogGrid"></div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ2NjokEEfkRUGD3QtUyDJM0jK_QCY19GH18Rl8UAyjo280P79x5BT1HqNzsZ5m5HxEI_xkMy4GQrNn/pub?output=csv";

  let productsMap = new Map();
  let currentSelection = "ALL"; // Может быть 'ALL', либо конкретная subcategory
  let searchQuery = "";

  function parseCSVLine(text) {
    const rows = [];
    let row = [], entry = "", insideQuotes = false;
    for (let i = 0; i < text.length; i++) {
      let c = text[i], next = text[i+1];
      if (c === '"' && insideQuotes && next === '"') { entry += '"'; i++; }
      else if (c === '"') { insideQuotes = !insideQuotes; }
      else if (c === ',' && !insideQuotes) { row.push(entry.trim()); entry = ""; }
      else if ((c === '\r' && next === '\n') || (c === '\n' && !insideQuotes)) {
        if (c === '\r' && next === '\n') i++;
        row.push(entry.trim());
        if (row.some(x => x !== "")) rows.push(row);
        row = []; entry = "";
      } else { entry += c; }
    }
    if (entry !== "" || row.length > 0) {
      row.push(entry.trim());
      if (row.some(x => x !== "")) rows.push(row);
    }
    return rows;
  }

  async function loadData() {
    const grid = document.getElementById("catalogGrid");
    grid.innerHTML = `<div class="status-msg">Загрузка данных...</div>`;

    try {
      const response = await fetch(CSV_URL);
      const text = await response.text();
      const rows = parseCSVLine(text);

      if (rows.length < 2) {
        grid.innerHTML = `<div class="status-msg">Таблица пустая</div>`;
        return;
      }

      productsMap.clear();

      for (let i = 1; i < rows.length; i++) {
        let r = rows[i];
        
        let gid = r[0] || `item-${i}`;       // Колонка A: group_id
        let cat = r[1] || "Прочее";          // Колонка B: category (Уровень 1)
        let sub = r[2] || "Общие";           // Колонка C: subcategory (Уровень 2)
        let name = r[3] || "Без названия";    // Колонка D: name
        let variant = r[4] || "";            // Колонка E: variant
        let price = r[5] || "0";             // Колонка F: price
        let stock = r[6] || "В наличии";     // Колонка G: stock
        let image = r[7] || "";              // Колонка H: image
        let specs = r[8] || "";              // Колонка I: specs
        let description = r[9] || "";        // Колонка J: description

        if (!productsMap.has(gid)) {
          productsMap.set(gid, {
            id: gid,
            category: cat,
            subcategory: sub,
            name: name,
            selectedIndex: 0,
            variants: []
          });
        }

        productsMap.get(gid).variants.push({
          variant: variant,
          price: price,
          stock: stock,
          image: image,
          specs: specs,
          description: description
        });
      }

      renderSidebar();
      renderGrid();

    } catch (e) {
      grid.innerHTML = `<div class="status-msg">Ошибка загрузки таблицы.</div>`;
    }
  }

  function renderSidebar() {
    const accordion = document.getElementById("categoryAccordion");
    const allBtn = document.getElementById("allCatsBtn");
    allBtn.className = `all-cats-btn ${currentSelection === 'ALL' ? 'active' : ''}`;

    // Строим дерево: Категория -> Набор подкатегорий
    const tree = {};
    productsMap.forEach(p => {
      if (!tree[p.category]) tree[p.category] = new Set();
      tree[p.category].add(p.subcategory);
    });

    let html = "";
    for (const [cat, subs] of Object.entries(tree)) {
      const subsArr = Array.from(subs);
      const isParentActive = subsArr.includes(currentSelection);
      
      html += `
        <div class="category-group ${isParentActive ? 'open' : ''}">
          <button class="cat-header ${isParentActive ? 'active-parent' : ''}" onclick="toggleCategory(this)">
            <span>${cat}</span>
            <span class="cat-arrow">▼</span>
          </button>
          <div class="sub-list">
            ${subsArr.map(sub => `
              <button class="sub-btn ${currentSelection === sub ? 'active' : ''}" onclick="setCategory('${sub}')">
                — ${sub}
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }
    accordion.innerHTML = html;
  }

  window.toggleCategory = function(btn) {
    btn.parentElement.classList.toggle("open");
  }

  window.setCategory = function(sub) {
    currentSelection = sub;
    renderSidebar();
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById("catalogGrid");
    let items = Array.from(productsMap.values());

    items = items.filter(item => {
      let matchCat = currentSelection === 'ALL' || item.subcategory === currentSelection;
      let matchSearch = !searchQuery || item.name.toLowerCase().includes(searchQuery.toLowerCase());
      return matchCat && matchSearch;
    });

    if (items.length === 0) {
      grid.innerHTML = `<div class="status-msg">Ничего не найдено</div>`;
      return;
    }

    grid.innerHTML = items.map(item => {
      let v = item.variants[item.selectedIndex] || item.variants[0];
      let hasVariants = item.variants.length > 1;
      let img = v.image ? v.image : 'https://placehold.co/400x300/f8fafc/94a3b8?text=Нет+фото';

      return `
        <div class="card">
          <div class="card-img" onclick="openModal('${item.id}')">
            <span class="badge">${item.subcategory}</span>
            <img src="${img}" alt="" onerror="this.src='https://placehold.co/400x300/f8fafc/94a3b8?text=Нет+фото'" />
          </div>
          <div class="card-body">
            <div class="title" onclick="openModal('${item.id}')">${item.name} ${v.variant ? `(${v.variant})` : ''}</div>
            
            ${hasVariants ? `
              <div class="variants">
                ${item.variants.map((vr, idx) => `
                  <button class="var-btn ${idx === item.selectedIndex ? 'active' : ''}" onclick="selectVar('${item.id}', ${idx})">${vr.variant}</button>
                `).join('')}
              </div>
            ` : ''}

            <div class="card-footer">
              <div>
                <div class="price">${v.price} ₽</div>
                <div class="stock in">${v.stock}</div>
              </div>
              <button class="details-btn" onclick="openModal('${item.id}')">Подробнее</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  window.selectVar = function(id, index) {
    let item = productsMap.get(id);
    if (item) {
      item.selectedIndex = index;
      renderGrid();
      if (document.getElementById("modalBackdrop").classList.contains("open")) {
        openModal(id);
      }
    }
  }

  window.openModal = function(id) {
    let item = productsMap.get(id);
    if (!item) return;
    let v = item.variants[item.selectedIndex];
    let img = v.image ? v.image : 'https://placehold.co/400x300/f8fafc/94a3b8?text=Нет+фото';
    let specsArr = v.specs ? v.specs.split(/[,;]/).map(s => s.trim()).filter(Boolean) : [];
    let hasVariants = item.variants.length > 1;

    document.getElementById("modalContent").innerHTML = `
      <h2>${item.name} ${v.variant ? `(${v.variant})` : ''}</h2>
      <img src="${img}" style="width:100%; max-height:200px; object-fit:contain; margin:10px 0;" />
      
      ${hasVariants ? `
        <div style="margin-bottom: 12px;">
          <div style="font-size: 13px; color: var(--muted); margin-bottom: 6px;">Выберите вариант:</div>
          <div class="variants">
            ${item.variants.map((vr, idx) => `
              <button class="var-btn ${idx === item.selectedIndex ? 'active' : ''}" onclick="selectVar('${item.id}', ${idx})">${vr.variant}</button>
            `).join('')}
          </div>
        </div>
      ` : ''}

      <p style="font-size:18px; font-weight:700; margin-bottom:4px;">${v.price} ₽</p>
      <p style="margin-bottom:12px; font-size:13px; color:var(--muted);">Наличие: ${v.stock}</p>
      
      ${specsArr.length ? `
        <div style="margin-top:12px; border-top:1px solid var(--border); padding-top:10px;">
          <b style="font-size:14px;">Характеристики:</b>
          <ul style="margin: 6px 0 0 18px; font-size:14px; color:var(--text);">
            ${specsArr.map(s => `<li style="margin-bottom:3px;">${s}</li>`).join('')}
          </ul>
        </div>
      ` : ''}

      ${v.description ? `<p style="margin-top:12px; font-size:13px; color:var(--muted); border-top:1px solid var(--border); padding-top:10px;">${v.description}</p>` : ''}
    `;
    document.getElementById("modalBackdrop").classList.add("open");
  }

  window.closeModal = function() {
    document.getElementById("modalBackdrop").classList.remove("open");
  }

  document.getElementById("searchInput").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderGrid();
  });

  loadData();
</script>
</body>
</html>
