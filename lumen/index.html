<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tom Studio — Project Lumen</title>
  <style>
    :root {
      --bg: #f4f4f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #1d4ed8;
      --accent-soft: rgba(29, 78, 216, 0.1);
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
      --bar-bg: linear-gradient(135deg, #1d4ed8 0%, #0f172a 100%);
      --bar-border: rgba(147, 197, 253, 0.28);
      --bar-shadow: 0 10px 26px rgba(15, 23, 42, 0.2);
    }

    body[data-theme="dark"] {
      --bg: #0b1120;
      --surface: #111827;
      --surface-alt: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #263349;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      --bar-bg: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      --bar-border: rgba(96, 165, 250, 0.32);
      --bar-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px 36px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .top-controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .theme-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .theme-btn:hover {
      border-color: var(--accent);
    }

    .ts-lumen-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 20px;
      border-radius: 16px;
      background: var(--bar-bg);
      border: 1px solid var(--bar-border);
      box-shadow: var(--bar-shadow);
      color: #ffffff;
    }

    .ts-lumen-brand {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: #ffffff;
      white-space: nowrap;
    }

    .ts-lumen-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .ts-lumen-project {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.2;
      color: #e2e8f0;
      text-align: right;
    }

    .card {
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    input[type="number"],
    input[type="text"],
    select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
